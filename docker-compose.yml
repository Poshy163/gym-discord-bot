# Everything is configured from the web dashboard — there is nothing to edit here.
#
#   1. docker compose up -d
#   2. open http://<this-host>:8099 and set a dashboard password
#   3. Settings → Discord → paste your bot token
#
# The bot starts as soon as a token is saved. Until then the dashboard runs on
# its own, which is what makes step 3 possible.
#
# SECURITY: between step 1 and step 2, anyone who can reach port 8099 can claim
# this instance and take control of the bot. Keep it on a LAN or behind a
# VPN/reverse proxy, or complete setup immediately after starting it.
#
# Environment variables still work and still take priority over anything set in
# the dashboard — see .env.example if you would rather pin something here.
#
# Backups: nightly snapshots land in /data/backups inside the volume. To keep
# them off-box, add a bind mount (- ./backups:/data/backups) and set the backup
# folder to /data/backups in Settings. Snapshots contain ciphertext only, so
# back up /data/.secret_key separately or the encrypted Revo/Strava/Hevy
# credentials cannot be recovered.

services:
  gym-bot:
    image: ghcr.io/poshy163/gym-discord-bot:latest
    restart: unless-stopped
    ports:
      - "8098:8080"   # Strava OAuth callback + webhook (needs public HTTPS in front)
      - "8099:8081"   # Operator dashboard
    volumes:
      - gym-data:/data

volumes:
  gym-data:
